server:
  port: 8081

spring:
  application:
    name: picture-manager

  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3307/picture_manager?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: update  # 重要：使用update而不是create，避免覆盖现有数据
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        jdbc:
          time_zone: Asia/Shanghai
    open-in-view: false

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# 自定义配置
app:
  jwt:
    secret: your-jwt-secret-key-here-change-in-production
    expiration: 86400000

  file:
    upload-dir: ./uploads
    thumbnail-dir: ./uploads/thumbnails
    thumbnail-width: 300
    allowed-types: image/jpeg,image/png,image/gif,image/webp

  # DeepSeek AI 配置
  deepseek:
    api-key: sk-e24743d0d4a44cf5817b2cb8ba850e3c
    api-url: https://api.deepseek.com/v1/chat/completions
    model: deepseek-chat

# 日志配置
logging:
  level:
    com.picturemanager: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE